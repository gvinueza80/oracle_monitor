apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: oracle-monitor
data:
  postgresql.conf: |
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 4MB
    min_wal_size = 4GB
    max_wal_size = 16GB
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle-monitor-postgres
  namespace: oracle-monitor
spec:
  serviceName: oracle-monitor-postgres
  replicas: 1
  selector:
    matchLabels:
      app: oracle-monitor
      component: postgres
  template:
    metadata:
      labels:
        app: oracle-monitor
        component: postgres
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999

      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP

        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oracle-monitor-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: oracle_monitor
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2

        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
          readOnly: true

      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
          items:
          - key: postgresql.conf
            path: postgresql.conf

  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-monitor-postgres
  namespace: oracle-monitor
  labels:
    app: oracle-monitor
    component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
  selector:
    app: oracle-monitor
    component: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oracle-monitor-postgres-pdb
  namespace: oracle-monitor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oracle-monitor
      component: postgres
